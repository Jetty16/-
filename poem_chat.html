<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>현실의 구름은 실선 꿈속의 구름은 점선</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { background: #fff; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Helvetica Neue', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  .header {
    padding: calc(env(safe-area-inset-top) + 8px) 14px 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 0.5px solid #E5E5EA;
    flex-shrink: 0;
    background: #fff;
  }
  .circle-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #F2F2F7;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 8px;
  }
  .header-center {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    flex: 1; padding: 0 8px;
  }
  .avatar {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #6E9FF0, #3D7CF5);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 600; color: #fff;
  }
  .name {
    font-size: 12px; font-weight: 400; color: #000; text-align: center; line-height: 1.3;
  }
  .name .chev { color: #AEAEB2; margin-left: 2px; }

  /* ── 대화 영역 ── */
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 10px 18px;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }
  .thread > :first-child { margin-top: auto; }
  .hint {
    text-align: center;
    font-size: 13px;
    font-weight: 400;
    color: #8E8E93;
    margin: auto 0 12px;
    transition: opacity .4s;
  }
  .hint.hidden { opacity: 0; }

  .row { display: flex; flex-direction: column; margin-top: 10px; opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; }
  .row.visible { opacity: 1; transform: translateY(0); }
  .row.me { align-items: flex-end; }
  .row.them { align-items: flex-start; }

  .bubble {
    position: relative;
    max-width: 76%;
    padding: 7px 12px 8px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.3;
    white-space: pre-line;
    word-break: keep-all;
  }
  /* 내 말풍선 = 파란 점선 (SVG로 테두리+꼬리를 그림) */
  .bubble.me { color: #007AFF; }
  .bubble.me svg { position: absolute; left: 0; top: 0; overflow: visible; z-index: 0; pointer-events: none; }
  .bubble .txt { position: relative; z-index: 1; }

  /* 상대 말풍선 = 꽉 찬 회색 */
  .bubble.them {
    background: #E9E9EB;
    color: #000;
    border-radius: 18px;
  }
  .bubble.them::before {
    content: ""; position: absolute; bottom: 0; left: -7px;
    width: 20px; height: 20px; background: #E9E9EB;
    border-bottom-right-radius: 15px;
  }
  .bubble.them::after {
    content: ""; position: absolute; bottom: 0; left: -10px;
    width: 10px; height: 20px; background: #fff;
    border-bottom-right-radius: 10px;
  }

  .datestamp {
    text-align: center; font-size: 12px; color: #8E8E93;
    margin: 6px 0 2px; font-weight: 500;
    opacity: 0; transition: opacity .4s;
  }
  .datestamp.visible { opacity: 1; }

  .status {
    font-size: 11px; color: #8E8E93; margin: 3px 4px 0 0; font-weight: 400;
  }
  .status b { font-weight: 600; }

  .typing {
    background: #E9E9EB; border-radius: 18px;
    padding: 11px 14px; display: flex; gap: 4px; margin-top: 10px;
    align-self: flex-start;
  }
  .typing i {
    width: 8px; height: 8px; border-radius: 50%; background: #A2A2A7; display: block;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }

  /* ── 입력창 ── */
  .input-bar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    background: #fff;
    flex-shrink: 0;
    transition: padding .3s;
  }
  body.kb-open .input-bar { padding-bottom: 8px; }
  .plus {
    width: 36px; height: 36px; border-radius: 50%;
    background: #F2F2F7;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pill {
    flex: 1;
    min-height: 36px;
    border: 1px solid #D1D1D6;
    border-radius: 19px;
    padding: 4px 4px 4px 14px;
    display: flex; align-items: flex-end; gap: 6px;
    cursor: pointer;
  }
  .pill-text {
    flex: 1;
    font-size: 14px; font-weight: 400; line-height: 1.3;
    padding: 5px 0;
    max-height: 112px; overflow-y: auto;
    white-space: pre-wrap; word-break: keep-all;
    color: #000;
  }
  .placeholder { color: #AEAEB2; }
  .caret {
    display: inline-block; width: 2px; height: 1.15em; background: #007AFF;
    vertical-align: -0.2em; margin-left: 1px;
    animation: caret 1s steps(1) infinite;
  }
  .caret.solid { animation: none; }
  @keyframes caret { 50% { opacity: 0; } }
  .send {
    width: 28px; height: 28px; border-radius: 50%;
    background: #D1D1D6;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: none;
    transition: background .2s;
  }
  .send.active { background: #007AFF; }

  /* ── 직접 그린 키보드 ── */
  .kb-wrap {
    height: 0; overflow: hidden; flex-shrink: 0;
    transition: height .32s cubic-bezier(.3,.8,.3,1);
  }
  .kb {
    background: #D9DBE0;
    border-radius: 26px 26px 0 0;
    padding: 10px 4px calc(env(safe-area-inset-bottom) + 4px);
  }
  .krow { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; padding: 0 2px; }
  .key {
    flex: 1; max-width: 34px; height: 44px;
    background: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; color: #000;
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
    transition: background .06s;
  }
  .krow.r2 { padding: 0 18px; }
  .key.wide { max-width: 46px; flex: 1.35; }
  .key.w2 { max-width: 60px; flex: 1.6; font-size: 17px; }
  .key.space { max-width: none; flex: 5; justify-content: flex-end; align-items: flex-end; padding: 0 10px 5px 0; font-size: 12px; color: #AEAEB2; }
  .key.ret { max-width: none; flex: 2.6; }
  .key.on { background: #AEB3BD; }
  .kb-bottom { display: flex; justify-content: space-between; padding: 2px 30px 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="circle-btn">
    <svg width="11" height="19" viewBox="0 0 11 19"><path d="M9.5 1.5L2 9.5L9.5 17.5" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  </div>
  <div class="header-center">
    <div class="avatar">시</div>
    <div class="name">현실의 구름은 실선 꿈속의 구름은 점선<span class="chev">›</span></div>
  </div>
  <div class="circle-btn">
    <svg width="24" height="17" viewBox="0 0 24 17"><rect x="1" y="1.5" width="15" height="14" rx="3.5" stroke="#000" stroke-width="1.8" fill="none"/><path d="M16 7l6.2-4.2v11.4L16 10z" stroke="#000" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
  </div>
</div>

<div class="thread" id="thread">
  <div class="hint" id="hint">입력창을 탭해서 시작하세요</div>
</div>

<div class="input-bar">
  <div class="plus">
    <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>
  <div class="pill" id="pill">
    <div class="pill-text" id="pillText"><span class="placeholder">iMessage</span></div>
    <button class="send" id="sendBtn" aria-label="전송">
      <svg width="13" height="14" viewBox="0 0 13 14"><path d="M6.5 13V1.8M6.5 1.8L1.5 6.8M6.5 1.8l5 5" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>
</div>

<div class="kb-wrap" id="kbWrap">
  <div class="kb" id="kb">
    <div class="krow">
      <div class="key" data-k="ㅂ">ㅂ</div><div class="key" data-k="ㅈ">ㅈ</div><div class="key" data-k="ㄷ">ㄷ</div><div class="key" data-k="ㄱ">ㄱ</div><div class="key" data-k="ㅅ">ㅅ</div><div class="key" data-k="ㅛ">ㅛ</div><div class="key" data-k="ㅕ">ㅕ</div><div class="key" data-k="ㅑ">ㅑ</div><div class="key" data-k="ㅐ">ㅐ</div><div class="key" data-k="ㅔ">ㅔ</div>
    </div>
    <div class="krow r2">
      <div class="key" data-k="ㅁ">ㅁ</div><div class="key" data-k="ㄴ">ㄴ</div><div class="key" data-k="ㅇ">ㅇ</div><div class="key" data-k="ㄹ">ㄹ</div><div class="key" data-k="ㅎ">ㅎ</div><div class="key" data-k="ㅗ">ㅗ</div><div class="key" data-k="ㅓ">ㅓ</div><div class="key" data-k="ㅏ">ㅏ</div><div class="key" data-k="ㅣ">ㅣ</div>
    </div>
    <div class="krow">
      <div class="key wide" data-k="shift"><svg width="22" height="20" viewBox="0 0 22 20"><path d="M11 2L2 11h4.5v7h9v-7H20z" stroke="#000" stroke-width="1.7" stroke-linejoin="round" fill="none"/></svg></div>
      <div class="key" data-k="ㅋ">ㅋ</div><div class="key" data-k="ㅌ">ㅌ</div><div class="key" data-k="ㅊ">ㅊ</div><div class="key" data-k="ㅍ">ㅍ</div><div class="key" data-k="ㅠ">ㅠ</div><div class="key" data-k="ㅜ">ㅜ</div><div class="key" data-k="ㅡ">ㅡ</div>
      <div class="key wide" data-k="back"><svg width="26" height="19" viewBox="0 0 26 19"><path d="M8 1.5h15a2 2 0 012 2v12a2 2 0 01-2 2H8L1.5 9.5z" stroke="#000" stroke-width="1.7" stroke-linejoin="round" fill="none"/><path d="M12 6l7 7M19 6l-7 7" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg></div>
    </div>
    <div class="krow">
      <div class="key w2" data-k="123">123</div>
      <div class="key w2" data-k="emoji"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#000" stroke-width="1.7" fill="none"/><circle cx="8.5" cy="9.5" r="1.3"/><circle cx="15.5" cy="9.5" r="1.3"/><path d="M7 14c1.2 2 2.9 3 5 3s3.8-1 5-3" stroke="#000" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg></div>
      <div class="key space" data-k="space">한</div>
      <div class="key ret" data-k="return"><svg width="28" height="18" viewBox="0 0 28 18"><path d="M25 1.5v7a3 3 0 01-3 3H3M3 11.5l5-5M3 11.5l5 5" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
    </div>
    <div class="kb-bottom">
      <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12.5" stroke="#000" stroke-width="1.7" fill="none"/><ellipse cx="15" cy="15" rx="5.5" ry="12.5" stroke="#000" stroke-width="1.5" fill="none"/><path d="M2.5 15h25M4.5 8.5h21M4.5 21.5h21" stroke="#000" stroke-width="1.5"/></svg>
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="10.5" y="2.5" width="9" height="16" rx="4.5" stroke="#000" stroke-width="1.7" fill="none"/><path d="M6.5 14a8.5 8.5 0 0017 0M15 22.5v5M10.5 27.5h9" stroke="#000" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
    </div>
  </div>
</div>

<script>
const myMessages = [
  '참 아픈 꿈을 꾸었다\n눈에 눈물은 세수를 재촉한다\n매번 눈물은 한순간에 나를 어린 애로 만들어버린다',
  '그때를 여러 번 꿈으로 인출시킨 탓에\n이제는 어디까지가 기억인지 추억인지 억측인지 모를 그때를\n아프게 조립한다',
  '꿈이 꿈이었다는 사실을 인정하고 사느니\n차라리 현실과 꿈을 구분 짓지 않기로 했다\n이건 점선이냐 실선이냐 정도의 차이일 뿐이니'
];
const theirMessages = [
  '일어나 눈을 비비는 사람이다',
  '일어나 멍을 때리는 사람이다',
  '잠이 많은 사람이다'
];

const thread = document.getElementById('thread');
const hint = document.getElementById('hint');
const pill = document.getElementById('pill');
const pillText = document.getElementById('pillText');
const sendBtn = document.getElementById('sendBtn');
const kbWrap = document.getElementById('kbWrap');
const kb = document.getElementById('kb');

let step = 0;
let phase = 'idle'; // idle → typing → ready → waiting

/* ── 한글 자모 분해 (자판 눌림 효과용) ── */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const SHIFTED = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ','ㅒ':'ㅐ','ㅖ':'ㅔ' };
const VSPLIT = { 'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ'] };
const TSPLIT = { 'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ'] };

const compose = (c, v, t) => String.fromCharCode(0xAC00 + (c * 21 + v) * 28 + t);
const keysFor = j => SHIFTED[j] ? ['shift', SHIFTED[j]] : [j];

function buildSteps(text) {
  const steps = [];
  let done = '';
  for (const ch of text) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) {
      const c = Math.floor(code / 588), v = Math.floor((code % 588) / 28), t = code % 28;
      steps.push({ keys: keysFor(CHO[c]), text: done + CHO[c] });
      const vp = VSPLIT[JUNG[v]];
      if (vp) {
        steps.push({ keys: keysFor(vp[0]), text: done + compose(c, JUNG.indexOf(vp[0]), 0) });
        steps.push({ keys: keysFor(vp[1]), text: done + compose(c, v, 0) });
      } else {
        steps.push({ keys: keysFor(JUNG[v]), text: done + compose(c, v, 0) });
      }
      if (t > 0) {
        const tp = TSPLIT[JONG[t]];
        if (tp) {
          steps.push({ keys: keysFor(tp[0]), text: done + compose(c, v, JONG.indexOf(tp[0])) });
          steps.push({ keys: keysFor(tp[1]), text: done + compose(c, v, t) });
        } else {
          steps.push({ keys: keysFor(JONG[t]), text: done + compose(c, v, t) });
        }
      }
    } else if (ch === ' ') {
      steps.push({ keys: ['space'], text: done + ' ', pause: 30 });
    } else if (ch === '\n') {
      steps.push({ keys: ['return'], text: done + '\n', pause: 220 });
    } else {
      steps.push({ keys: [], text: done + ch });
    }
    done += ch;
  }
  return steps;
}

/* ── 화면 표시 도우미 ── */
function scrollDown() {
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

function setPill(text, caretMode) {
  pillText.innerHTML = '';
  if (!text) {
    if (caretMode) {
      const c = document.createElement('span');
      c.className = 'caret';
      pillText.appendChild(c);
    }
    const p = document.createElement('span');
    p.className = 'placeholder';
    p.textContent = 'iMessage';
    pillText.appendChild(p);
    return;
  }
  pillText.appendChild(document.createTextNode(text));
  if (caretMode) {
    const c = document.createElement('span');
    c.className = 'caret' + (caretMode === 'solid' ? ' solid' : '');
    pillText.appendChild(c);
  }
  pillText.scrollTop = pillText.scrollHeight;
}

function openKeyboard() {
  kbWrap.style.height = kb.offsetHeight + 'px';
  document.body.classList.add('kb-open');
  setTimeout(scrollDown, 340);
}
function closeKeyboard() {
  kbWrap.style.height = '0px';
  document.body.classList.remove('kb-open');
}

function pressKeys(keys) {
  kb.querySelectorAll('.key.on').forEach(k => k.classList.remove('on'));
  keys.forEach(k => {
    const el = kb.querySelector('[data-k="' + k + '"]');
    if (el) el.classList.add('on');
  });
}

function timeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function dateStr() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ') ' + timeStr();
}

/* 점선 말풍선: 테두리 + 꼬리를 SVG로 그림 */
function mePath(w, h) {
  const s = 0.75;
  const x0 = s, y0 = s, x1 = w - s, y1 = h - s;
  const r = Math.min(18, (h - 2 * s) / 2);
  return [
    'M', x0 + r, y0,
    'H', x1 - r,
    'A', r, r, 0, 0, 1, x1, y0 + r,
    'V', y1 - 8,
    'Q', x1, y1, x1 + 5.5, y1,
    'Q', x1 - 1.5, y1 - 0.3, x1 - 6.5, y1 - 3.2,
    'Q', x1 - 10, y1, x1 - r, y1,
    'H', x0 + r,
    'A', r, r, 0, 0, 1, x0, y1 - r,
    'V', y0 + r,
    'A', r, r, 0, 0, 1, x0 + r, y0,
    'Z'
  ].join(' ');
}
function drawMeBubble(bubble) {
  const old = bubble.querySelector('svg');
  if (old) old.remove();
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', w + 7);
  svg.setAttribute('height', h);
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', mePath(w, h));
  path.setAttribute('fill', '#fff');
  path.setAttribute('stroke', '#8EC1F2');
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('stroke-dasharray', '5 3.5');
  path.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(path);
  bubble.insertBefore(svg, bubble.firstChild);
}
window.addEventListener('resize', () => {
  document.querySelectorAll('.bubble.me').forEach(drawMeBubble);
});

function addBubble(sender, text) {
  const row = document.createElement('div');
  row.className = 'row ' + sender;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + sender;
  const t = document.createElement('span');
  t.className = 'txt';
  t.textContent = text;
  bubble.appendChild(t);
  row.appendChild(bubble);
  thread.appendChild(row);
  if (sender === 'me') drawMeBubble(bubble);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    row.classList.add('visible');
    scrollDown();
  }));
  return row;
}

/* ── 흐름 ── */
function startTyping() {
  const steps = buildSteps(myMessages[step]);
  let i = 0;
  function next() {
    if (i < steps.length) {
      const s = steps[i++];
      pressKeys(s.keys);
      setPill(s.text, 'solid');
      setTimeout(next, 55 + (s.pause || 0));
    } else {
      pressKeys([]);
      setPill(myMessages[step], 'blink');
      phase = 'ready';
      sendBtn.classList.add('active');
    }
  }
  next();
}

pill.addEventListener('click', e => {
  if (e.target.closest('#sendBtn')) return;
  if (phase !== 'idle' || step >= myMessages.length) return;
  phase = 'typing';
  hint.classList.add('hidden');
  setPill('', 'blink');
  openKeyboard();
  setTimeout(startTyping, 420);
});

sendBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (phase !== 'ready') return;
  phase = 'waiting';
  sendBtn.classList.remove('active');

  const text = myMessages[step];
  setPill('', false);
  closeKeyboard();

  // 이전 상태 표시 제거 (아이메시지는 마지막 메시지에만 표시)
  thread.querySelectorAll('.status').forEach(s => s.remove());

  if (step === 0) {
    hint.remove();
    const ds = document.createElement('div');
    ds.className = 'datestamp';
    ds.textContent = dateStr();
    thread.appendChild(ds);
    requestAnimationFrame(() => requestAnimationFrame(() => ds.classList.add('visible')));
  }

  const row = addBubble('me', text);
  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = '전송됨';
  row.appendChild(status);
  scrollDown();

  // 전송됨 → 읽음
  setTimeout(() => {
    status.innerHTML = '<b>읽음</b> ' + timeStr();
  }, 1300);

  // 읽음 → 점 세 개
  setTimeout(() => {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    thread.appendChild(typing);
    scrollDown();

    // 점 세 개 → 답장
    setTimeout(() => {
      typing.remove();
      addBubble('them', theirMessages[step]);
      step++;
      phase = 'idle';
    }, 1900);
  }, 2400);
});
</script>
